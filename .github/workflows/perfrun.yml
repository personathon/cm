
name: k6 Load Test

run-name: k6 Load Test - ${{ github.actor }}

on:
  # Automatically trigger when a PR is closed against main.
  push:
    branches:
      - main
      
  # Retain manual execution with three user inputs.
  workflow_dispatch:
    inputs:
      swagger_url:
        description: "URL to the Swagger/OpenAPI specification"
        type: string
        required: true

      k6_api_url:
        description: "URL of the k6 generator API"
        type: string
        required: true

      tags:
        description: "API tags (comma-separated). Leave empty to test all."
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  K6_DIR: ./k6_tests

jobs:
  load-test:
    name: Generate & Run k6 Load Test

    # Execute only for merged PRs or manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    steps:

      # ── 0. Checkout merged repository code ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ── 1. Install k6 ───────────────────────────────────────
      - name: Install k6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          K6_VERSION=$(curl -f -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/grafana/k6/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$K6_VERSION" ] || [ "$K6_VERSION" = "null" ]; then
            echo "ERROR: Unable to determine k6 version"
            exit 1
          fi

          echo "Installing k6 ${K6_VERSION}"

          curl -f -sS -L \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            -o k6.tar.gz

          tar xzf k6.tar.gz

          sudo mv "k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6

          k6 version

      # ── 2. Fetch Swagger specification ─────────────────────
      - name: Fetch Swagger spec
        env:
          DISPATCH_SWAGGER_URL: ${{ inputs.swagger_url }}
          AUTO_SWAGGER_URL: ${{ vars.SWAGGER_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            SWAGGER_URL="$DISPATCH_SWAGGER_URL"
          else
            SWAGGER_URL="$AUTO_SWAGGER_URL"
          fi

          if [ -z "$SWAGGER_URL" ]; then
            echo "ERROR: Swagger URL is not configured"
            exit 1
          fi

          echo "Fetching Swagger specification..."

          curl -f -sS "$SWAGGER_URL" -o swagger.json

          echo "Fetched spec: $(wc -c < swagger.json) bytes"

      # ── 3. Build tags query parameters ──────────────────────
      - name: Build tag query params
        id: tags
        env:
          DISPATCH_TAGS: ${{ inputs.tags }}
          AUTO_TAGS: ${{ vars.K6_TAGS }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAGS="$DISPATCH_TAGS"
          else
            TAGS="$AUTO_TAGS"
          fi

          QUERY=""

          if [ -n "$TAGS" ]; then
            QUERY=$(TAGS="$TAGS" python3 -c '
          import os
          from urllib.parse import urlencode

          tags = [
              tag.strip()
              for tag in os.environ["TAGS"].split(",")
              if tag.strip()
          ]

          print(
              "?" + urlencode([("tags", tag) for tag in tags])
              if tags else ""
          )
          ')
          fi

          echo "query=${QUERY}" >> "$GITHUB_OUTPUT"
          echo "Selected tags: ${TAGS:-ALL}"

      # ── 4. Resolve generator API URL ────────────────────────
      - name: Resolve generator API URL
        id: api
        env:
          DISPATCH_API_URL: ${{ inputs.k6_api_url }}
          AUTO_API_URL: ${{ vars.K6_API_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            API_URL="$DISPATCH_API_URL"
          else
            API_URL="$AUTO_API_URL"
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: K6_API_URL is not configured"
            exit 1
          fi

          API_URL="${API_URL%/}"

          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

      # ── 5. Generate k6 bundle ───────────────────────────────
      - name: Generate k6 test bundle
        env:
          API_URL: ${{ steps.api.outputs.url }}
          TAG_QUERY: ${{ steps.tags.outputs.query }}
        run: |
          echo "Calling k6 generator API..."

          curl -f -sS -X POST \
            "${API_URL}/generate${TAG_QUERY}" \
            -F "file=@swagger.json" \
            -o k6_tests.zip

          echo "Downloaded $(du -sh k6_tests.zip | cut -f1) zip"

      # ── 6. Extract generated k6 project ──────────────────────
      - name: Extract test bundle
        id: extract
        run: |
          mkdir -p "${K6_DIR}"

          unzip -o k6_tests.zip -d "${K6_DIR}/"

          echo "Extracted files:"
          ls -lh "${K6_DIR}/"

          echo "data_csv=false" >> "$GITHUB_ENV"

          if [ -f "${K6_DIR}/data.csv" ]; then
            echo "data_csv=true" >> "$GITHUB_ENV"
            echo "data.csv present — parameterized test"
          else
            echo "No data.csv — public/unauthenticated test"
          fi

          K6_SCRIPT=$(find "${K6_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*.js' \
            -printf '%f\n' | sort | head -n 1)

          if [ -z "$K6_SCRIPT" ]; then
            echo "ERROR: No JavaScript k6 script found"
            exit 1
          fi

          echo "script=$K6_SCRIPT" >> "$GITHUB_OUTPUT"

      # ── 7. Validate k6 script syntax ────────────────────────
      - name: Validate k6 script syntax
        working-directory: ${{ env.K6_DIR }}
        run: |
          k6 inspect "${{ steps.extract.outputs.script }}"

      # ── 8. Execute k6 load test ─────────────────────────────
      - name: Run k6 load test
        id: k6
        working-directory: ${{ env.K6_DIR }}
        run: |
          set +e

          k6 run \
            --vus 1 \
            --duration 30s \
            --summary-export=../summary.json \
            --out json=../results.json \
            "${{ steps.extract.outputs.script }}" \
            2>&1 | tee ../k6_output.txt

          K6_EXIT=${PIPESTATUS[0]}

          echo "exit_code=$K6_EXIT" >> "$GITHUB_OUTPUT"

          echo "k6 exit code: $K6_EXIT"

          # Continue to publish reports even when k6 fails.
          exit 0

      # ── 9. Parse k6 metrics ─────────────────────────────────
      - name: Parse k6 metrics
        id: metrics
        if: always()
        env:
          K6_EXIT_CODE: ${{ steps.k6.outputs.exit_code }}
        run: |
          REQS=$(jq -r '.metrics.http_reqs.values.count // 0' summary.json 2>/dev/null || echo 0)

          ERR_RATE=$(jq -r '((.metrics.http_req_failed.values.rate // 0) * 100) | round' summary.json 2>/dev/null || echo 0)

          P95=$(jq -r '(.metrics.http_req_duration.values["p(95)"] // 0) | round' summary.json 2>/dev/null || echo 0)

          AVG=$(jq -r '(.metrics.http_req_duration.values.avg // 0) | round' summary.json 2>/dev/null || echo 0)

          VUS=$(jq -r '.metrics.vus_max.values.max // 0' summary.json 2>/dev/null || echo 0)

          CHECKS_PASS=$(jq -r '.metrics.checks.values.passes // 0' summary.json 2>/dev/null || echo 0)

          CHECKS_FAIL=$(jq -r '.metrics.checks.values.fails // 0' summary.json 2>/dev/null || echo 0)

          if [ "$K6_EXIT_CODE" = "0" ]; then
            STATUS="Passed"
            ICON="SUCCESS"
          else
            STATUS="Failed"
            ICON="FAILED"
          fi

          echo "reqs=$REQS" >> "$GITHUB_OUTPUT"
          echo "err_rate=$ERR_RATE" >> "$GITHUB_OUTPUT"
          echo "p95=$P95" >> "$GITHUB_OUTPUT"
          echo "avg=$AVG" >> "$GITHUB_OUTPUT"
          echo "vus=$VUS" >> "$GITHUB_OUTPUT"
          echo "checks_pass=$CHECKS_PASS" >> "$GITHUB_OUTPUT"
          echo "checks_fail=$CHECKS_FAIL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "icon=$ICON" >> "$GITHUB_OUTPUT"

          if [ "${data_csv:-false}" = "true" ]; then
            echo "parameterized=Yes (data.csv)" >> "$GITHUB_OUTPUT"
          else
            echo "parameterized=No" >> "$GITHUB_OUTPUT"
          fi

      # ── 10. Upload raw k6 results ───────────────────────────
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: |
            k6_output.txt
            summary.json
            results.json
          if-no-files-found: warn

      # ── 11. Generate custom HTML report ─────────────────────
      - name: Generate HTML report
        if: always()
        run: |
          if [ -f results.json ] && [ -f generate_html.py ]; then
            mkdir -p report

            python3 generate_html.py results.json -o report/index.html

            echo "HTML report generated"
          else
            echo "HTML report skipped: results.json or generate_html.py missing"
          fi

      # ── 12. Upload HTML report ──────────────────────────────
      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-html-report-${{ github.run_number }}
          path: report/index.html
          if-no-files-found: warn

      # ── 13. AI analysis: GO / NO-GO verdict ─────────────────
      - name: Analyse k6 results
        id: analyse
        if: always()
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          if [ ! -f results.json ] || [ -z "$API_URL" ]; then
            echo "verdict=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "Analysis skipped: results or API URL unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RESPONSE=$(curl -f -sS -X POST \
            "${API_URL}/analyse" \
            -F "file=@results.json" \
            2>/dev/null || echo '{"verdict":"UNKNOWN","markdown":"Analysis skipped — API unreachable."}')

          VERDICT=$(echo "$RESPONSE" | jq -r '.verdict // "UNKNOWN"')

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          echo "$RESPONSE" | jq -r '.markdown // ""' >> "$GITHUB_STEP_SUMMARY"

      # ── 14. Print run URL ───────────────────────────────────
      - name: Print run URL
        if: always()
        run: |
          echo ""
          echo "Actions run:"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "AI verdict: ${{ steps.analyse.outputs.verdict }}"
          echo ""

      # ── 15. Print test summary ──────────────────────────────
      - name: Print test summary
        if: always()
        run: |
          echo "========================================"
          echo "  k6 Load Test — ${{ steps.metrics.outputs.icon }}"
          echo "  Status: ${{ steps.metrics.outputs.status }}"
          echo "  AI Verdict: ${{ steps.analyse.outputs.verdict }}"
          echo "========================================"

          echo "Repository    : ${{ github.repository }}"
          echo "Branch        : ${{ github.ref_name }}"
          echo "Event         : ${{ github.event_name }}"
          echo "Run           : #${{ github.run_number }}"

          echo "Virtual Users : ${{ steps.metrics.outputs.vus }}"
          echo "Total Requests: ${{ steps.metrics.outputs.reqs }}"
          echo "Error Rate    : ${{ steps.metrics.outputs.err_rate }}%"
          echo "Avg Response  : ${{ steps.metrics.outputs.avg }} ms"
          echo "p95 Response  : ${{ steps.metrics.outputs.p95 }} ms"

          echo "Checks Passed : ${{ steps.metrics.outputs.checks_pass }}"
          echo "Checks Failed : ${{ steps.metrics.outputs.checks_fail }}"

          echo "Parameterized : ${{ steps.metrics.outputs.parameterized }}"

          echo "========================================"

          echo "Actions report:"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "========================================"
          echo ""
          echo "-------- k6 Output --------"

          cat k6_output.txt 2>/dev/null || echo "(no output)"

      # ── 16. Fail workflow if k6 execution failed ────────────
      - name: Fail workflow if k6 failed
        if: always() && steps.k6.outputs.exit_code != '0'
        run: |
          echo "k6 execution failed."
          exit 1
