
name: k6 Load Test

run-name: k6 Load Test - ${{ github.actor }}

on:
  # Triggered by the central GitStream automation after the LinearB code-review action completes.
  # Manual execution is retained for troubleshooting and one-off tests.
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Application repository (owner/repo), supplied by GitStream"
        type: string
        required: false
        default: ""
        
      pr_number:
        description: 'Original application PR number'
        required: false
        type: string
        
      swagger_url:
        description: "Optional Swagger/OpenAPI URL for manual execution"
        type: string
        required: false
        default: ""

      k6_api_url:
        description: "Optional k6 generator API URL; defaults to K6_API_URL variable"
        type: string
        required: false
        default: ""

      tags:
        description: "API tags (comma-separated). Leave empty to test all."
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  K6_DIR: ./k6_tests

jobs:
  load-test:
    name: Generate & Run k6 Load Test

    # Executed after the LinearB review action, or through manual dispatch.

    runs-on: ubuntu-latest

    steps:

      # ── 0. Checkout central CM repository ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ── 1. Install k6 ───────────────────────────────────────
      - name: Install k6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          K6_VERSION=$(curl -f -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/grafana/k6/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$K6_VERSION" ] || [ "$K6_VERSION" = "null" ]; then
            echo "ERROR: Unable to determine k6 version"
            exit 1
          fi

          echo "Installing k6 ${K6_VERSION}"

          curl -f -sS -L \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            -o k6.tar.gz

          tar xzf k6.tar.gz

          sudo mv "k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6

          k6 version

      # ── 2. Resolve and fetch Swagger specification ───────────
      - name: Resolve and fetch Swagger spec
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          DISPATCH_SWAGGER_URL: ${{ inputs.swagger_url }}
          SWAGGER_URL_MAP: ${{ vars.SWAGGER_URL_MAP }}
          AUTO_SWAGGER_URL: ${{ vars.SWAGGER_URL }}
        run: |
